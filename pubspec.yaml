name: mimedica_app
description: "Mimedica: sabe cuándo se acaba el medicamento y empieza a gestionarlo 10 días antes."
publish_to: 'none'

version: 0.1.2+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  supabase_flutter: ^2.15.4
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  image_picker: ^1.2.1
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  fonts:
    - family: General Sans
      fonts:
        - asset: assets/fonts/GeneralSans-Regular.otf
          weight: 400
        - asset: assets/fonts/GeneralSans-Medium.otf
          weight: 500
        - asset: assets/fonts/GeneralSans-Semibold.otf
          weight: 600
